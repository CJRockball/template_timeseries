type: xgb
params:
  objective: binary:logistic
  eval_metric: aucpr
  n_estimators: 300
  early_stopping_rounds: 20
  max_depth: 3
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  scale_pos_weight: auto
  device: cpu
